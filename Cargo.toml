[package]
name = "rs_raspi_camera"
version = "0.1.0"
edition = "2021"
authors = ["Developer <developer@example.com>"]
description = "Beautiful Rust camera web application optimized for Raspberry Pi"
license = "MIT"
repository = "https://github.com/USERNAME/rs_raspi_camera"
keywords = ["raspberry-pi", "web", "rust", "axum", "arm64"]
categories = ["web-programming::http-server"]

[dependencies]
axum = "0.8.4"
tokio = { version = "1.0", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["fs"] }
opencv = { version = "0.93", default-features = false, features = ["imgproc", "imgcodecs", "videoio", "highgui"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.0"
futures = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
image = "0.25"
rand = "0.8"

[features]
default = []
real_camera = ["opencv"]

[[bin]]
name = "rs_raspi_camera"
path = "src/main.rs"
